[package]
name = "browser-router"
version = "0.1.0"
edition = "2024"
description = "A lightweight Windows URL dispatcher"
license = "MIT"
repository = "https://github.com/tdharris/browser-router"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = "symbols"

[build-dependencies]
winresource = "0.1"

[dependencies]
regex = { version = "1.12", default-features = false, features = ["perf", "std"] }
serde = { version = "1.0", features = ["derive"] }
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.55"
